<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR-Reifegrad-Check mit Vertiefung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  /* Design-System "Verdant Stillness" */
  --ground:#F3F6F3; --surface:#FFFFFF; --surface-2:#E8EFEA;
  --ink:#484848; --ink-2:#5F7386; --ink-3:#828282;
  --line:#DEE6E0; --line-strong:#C6D2C9;
  --accent:#61876E; --accent-soft:#DAE9E0;
  /* Rose: erscheint einmal, wo etwas Menschliches benannt wird (engster Punkt / Hinweise) */
  --signal:#8C5A59; --signal-soft:#F4ECEC; --signal-line:#D8C3C2;
  /* Ampel-Zonen: rot -> ocker -> hellsage -> Sage (bestes) */
  --s1:#B25B4A; --s2:#CD9A5B; --s3:#9DB8A6; --s4:#61876E;
  --focus:#61876E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1311; --surface:#161C18; --surface-2:#1F2620;
    --ink:#E6ECE7; --ink-2:#9DB0A4; --ink-3:#7F8A82;
    --line:#28322B; --line-strong:#3B473E;
    --accent:#8FB39C; --accent-soft:#1B241E;
    --signal:#C79A99; --signal-soft:#241A1A; --signal-line:#4A3736;
    --s1:#C4715F; --s2:#D8B172; --s3:#7FA890; --s4:#A9C7B4;
    --focus:#8FB39C;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1311; --surface:#161C18; --surface-2:#1F2620;
  --ink:#E6ECE7; --ink-2:#9DB0A4; --ink-3:#7F8A82;
  --line:#28322B; --line-strong:#3B473E;
  --accent:#8FB39C; --accent-soft:#1B241E;
  --signal:#C79A99; --signal-soft:#241A1A; --signal-line:#4A3736;
  --s1:#C4715F; --s2:#D8B172; --s3:#7FA890; --s4:#A9C7B4;
  --focus:#8FB39C;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Work Sans","Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px; margin:0 auto; padding:40px 20px 72px;}

.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 10px;
}
h1{
  font-size:clamp(28px,4.4vw,40px); line-height:1.12; font-weight:700;
  letter-spacing:-.015em; margin:0 0 12px; text-wrap:balance;
}
.lede{
  font-family:"Source Serif 4",Georgia,serif; font-size:17.5px;
  color:var(--ink-2); margin:0 0 20px; max-width:60ch;
}
.meta{
  display:flex; flex-wrap:wrap; gap:6px 14px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12px; color:var(--ink-3); margin:0 0 28px;
}
.meta span{white-space:nowrap}

.topbar{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:26px;}
.langtoggle{display:flex; border:1px solid var(--line-strong); border-radius:999px; overflow:hidden; flex:none;}
.langtoggle button{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px; letter-spacing:.08em;
  background:transparent; color:var(--ink-3); border:0; padding:6px 12px; cursor:pointer;
}
.langtoggle button[aria-pressed="true"]{background:var(--accent); color:var(--ground);}

/* progress rail: one segment per dimension */
.rail{display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin:0 0 8px; padding:0; list-style:none;}
.rail li{height:4px; background:var(--line); border-radius:2px;}
.rail li[data-state="done"]{background:var(--s3);}
.rail li[data-state="current"]{background:var(--accent);}
.railmeta{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  color:var(--ink-3); letter-spacing:.06em; margin:0 0 26px;
}

.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:6px; padding:26px 24px;
}
.dimhead{margin:0 0 4px; font-size:22px; font-weight:700; letter-spacing:-.01em;}
.dimintro{font-family:"Source Serif 4",Georgia,serif; color:var(--ink-2); margin:0 0 24px; font-size:16.5px;}

fieldset{border:0; padding:0; margin:0 0 26px;}
fieldset:last-of-type{margin-bottom:8px;}
legend{
  font-size:16.5px; font-weight:500; line-height:1.45; padding:0;
  margin-bottom:12px; color:var(--ink); max-width:62ch;
}
legend .qno{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px;
  color:var(--ink-3); margin-right:8px;
}
.opts{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
@media (max-width:560px){ .opts{grid-template-columns:1fr;} }
.opt{position:relative;}
.opt input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer;}
.opt span{
  display:block; padding:11px 12px; border:1px solid var(--line-strong);
  border-radius:4px; font-size:13.5px; line-height:1.3; color:var(--ink-2);
  background:var(--surface); cursor:pointer; transition:border-color .12s, background .12s, color .12s;
  min-height:100%;
}
.opt input:hover + span{border-color:var(--accent);}
.opt input:focus-visible + span{outline:2px solid var(--focus); outline-offset:2px;}
.opt input:checked + span{background:var(--accent); border-color:var(--accent); color:var(--ground); font-weight:500;}

.nav{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:26px;}
.btn{
  font-family:"Work Sans",sans-serif; font-size:15px; font-weight:600;
  padding:12px 22px; border-radius:4px; border:1px solid var(--accent);
  background:var(--accent); color:var(--ground); cursor:pointer; transition:opacity .12s;
}
.btn:hover{opacity:.88}
.btn:focus-visible{outline:2px solid var(--focus); outline-offset:3px;}
.btn[disabled]{opacity:.4; cursor:not-allowed;}
.btn-ghost{background:transparent; color:var(--ink-2); border-color:var(--line-strong);}
.btn-ghost:hover{color:var(--ink); border-color:var(--ink-3); opacity:1;}
.hint{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px; color:var(--ink-3);}

/* lead step */
.fields{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:22px 0 6px;}
@media (max-width:560px){ .fields{grid-template-columns:1fr;} }
.field{display:flex; flex-direction:column; gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:13px; font-weight:500; color:var(--ink-2);}
.field input, .field select{
  font-family:"Work Sans",sans-serif; font-size:15px; color:var(--ink);
  background:var(--surface); border:1px solid var(--line-strong);
  border-radius:4px; padding:10px 11px;
}
.field input:focus-visible, .field select:focus-visible{outline:2px solid var(--focus); outline-offset:1px;}
.consent{display:flex; gap:10px; align-items:flex-start; margin:14px 0 0; padding:12px 13px;
  border:1px solid var(--line); border-radius:4px; background:var(--surface-2);
  font-size:13.5px; color:var(--ink-2); line-height:1.45; cursor:pointer;}
.consent input{margin-top:2px; flex:none; width:17px; height:17px; accent-color:var(--accent); cursor:pointer;}
.consent.invalid{border-color:var(--signal); background:var(--signal-soft);}
.field input.invalid, .field select.invalid{border-color:var(--signal); border-width:2px;}
.req{color:var(--signal); margin-left:3px;}
.err{color:var(--signal); font-size:14px; font-weight:500; margin:14px 0 0; min-height:1.2em;}
.err:not(:empty){padding-left:14px; border-left:2px solid var(--signal);}

/* results */
.verdict{
  border:1px solid var(--line); border-radius:6px; background:var(--surface);
  padding:28px 24px; margin-bottom:16px;
}
.stagechip{
  display:inline-flex; align-items:center; gap:9px;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:12px;
}
.stagedots{display:inline-flex; gap:3px;}
.stagedots i{width:16px; height:5px; border-radius:2px; background:var(--line); display:block;}
.stagedots i.on{background:var(--accent);}
.verdict h2{font-size:clamp(24px,3.6vw,32px); font-weight:700; letter-spacing:-.015em; margin:0 0 10px;}
.verdict p{font-family:"Source Serif 4",Georgia,serif; font-size:17px; color:var(--ink-2); margin:0 0 12px; max-width:62ch;}
.verdict p:last-child{margin-bottom:0;}

.section-label{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);
  margin:32px 0 12px;
}
.profile{border:1px solid var(--line); border-radius:6px; background:var(--surface); overflow:hidden;}
.prow{
  display:grid; grid-template-columns:1fr 180px 76px; gap:14px; align-items:center;
  padding:14px 18px; border-bottom:1px solid var(--line);
}
.prow:last-child{border-bottom:0;}
.prow.weak{background:var(--signal-soft);}
@media (max-width:560px){
  .prow{grid-template-columns:1fr 76px; gap:6px 12px;}
  .meter{grid-column:1/-1;}
}
.pname{font-size:14.5px; font-weight:500;}
.pname .tag{
  display:inline-block; margin-left:8px; padding:1px 7px; border-radius:3px;
  border:1px solid var(--signal-line); background:var(--surface);
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--signal); vertical-align:1px;
}
.meter{display:grid; grid-template-columns:repeat(4,1fr); gap:2px;}
.meter i{height:9px; border-radius:2px; background:var(--surface-2); display:block;}
.pscore{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:13px;
  font-variant-numeric:tabular-nums; color:var(--ink-2); text-align:right; white-space:nowrap;
}

.notes{display:grid; gap:14px; margin-top:14px;}
.note{border-left:2px solid var(--line-strong); padding:2px 0 2px 16px;}
.note.weak{border-left-color:var(--signal);}
.note h3{font-size:14.5px; font-weight:600; margin:0 0 4px;}
.note p{font-family:"Source Serif 4",Georgia,serif; font-size:16px; color:var(--ink-2); margin:0; max-width:62ch;}

.gap{
  border:1px solid var(--signal-line); background:var(--signal-soft);
  border-radius:6px; padding:22px 22px; margin-top:28px;
}
.gap .section-label{margin:0 0 8px; color:var(--signal);}
.gap h3{font-size:19px; font-weight:700; margin:0 0 8px;}
.gap p{font-family:"Source Serif 4",Georgia,serif; font-size:16.5px; color:var(--ink-2); margin:0; max-width:62ch;}

.cta{
  border:1px solid var(--line); border-radius:6px; background:var(--surface);
  padding:26px 24px; margin-top:16px;
}
.cta h3{font-size:20px; font-weight:700; margin:0 0 8px;}
.cta p{font-family:"Source Serif 4",Georgia,serif; font-size:16.5px; color:var(--ink-2); margin:0 0 18px; max-width:62ch;}
.ctarow{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
.ctarow a.btn{text-decoration:none; display:inline-block;}

.foot{
  margin-top:28px; font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px; color:var(--ink-3); line-height:1.6;
}

/* --- Vertiefung (v2) --- */
.deepoffer{
  border:1px solid var(--line); border-radius:6px; background:var(--surface-2);
  padding:24px 22px; margin-top:16px;
}
.deepoffer h3{font-size:20px; font-weight:700; margin:0 0 8px;}
.deepoffer .section-label{margin:0 0 8px;}
.deeptext{font-family:"Source Serif 4",Georgia,serif; font-size:16.5px; color:var(--ink-2); margin:0 0 18px; max-width:62ch;}
.deepdone{font-family:"Source Serif 4",Georgia,serif; font-size:16.5px; color:var(--ink-2); margin:0;}
.deeppick{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
.deeppick select{
  font-family:"Work Sans",sans-serif; font-size:15px; color:var(--ink);
  background:var(--surface); border:1px solid var(--line-strong);
  border-radius:4px; padding:11px 11px; min-width:250px; flex:1 1 250px;
}
.deeppick select:focus-visible{outline:2px solid var(--focus); outline-offset:1px;}

.groupname{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);
  margin:26px 0 12px; padding-top:18px; border-top:1px solid var(--line);
}
#deepquestions .groupname:first-child{margin-top:0; padding-top:0; border-top:0;}

.freeblock{margin-top:26px; padding-top:22px; border-top:1px solid var(--line);}
.freeblock .section-label{margin:0 0 8px;}
.freeblock p.freeq{font-size:16.5px; font-weight:500; margin:0 0 10px; max-width:62ch;}
.freeblock textarea{
  width:100%; min-height:96px; resize:vertical;
  font-family:"Work Sans",sans-serif; font-size:15px; line-height:1.5; color:var(--ink);
  background:var(--surface); border:1px solid var(--line-strong); border-radius:4px; padding:11px;
}
.freeblock textarea:focus-visible{outline:2px solid var(--focus); outline-offset:1px;}
.freehint{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px; color:var(--ink-3); margin:8px 0 0;}

.deepverdict{
  border:1px solid var(--line); border-radius:6px; background:var(--surface);
  padding:26px 24px; margin-bottom:16px;
  display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap;
}
.deepverdict h2{font-size:clamp(22px,3.2vw,28px); font-weight:700; letter-spacing:-.015em; margin:0;}
.deepverdict .big{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:20px;
  font-variant-numeric:tabular-nums; color:var(--ink-2); white-space:nowrap;
}
.subs{display:grid; gap:12px;}
.subrow{border:1px solid var(--line); border-radius:6px; background:var(--surface); padding:16px 18px;}
.subrow.weakish{border-left:3px solid var(--signal);}
.subhead{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:9px;}
.subname{font-size:15px; font-weight:600;}
.subscore{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--ink-3); white-space:nowrap;}
.subrow .meter{margin-bottom:11px; max-width:220px;}
.subrow p{font-family:"Source Serif 4",Georgia,serif; font-size:16px; color:var(--ink-2); margin:0; max-width:62ch;}

.leverlist, .teamlist{list-style:none; margin:0; padding:0; display:grid; gap:10px;}
.leverlist li{
  border:1px solid var(--line); border-radius:6px; background:var(--surface);
  padding:14px 16px; font-size:15px; line-height:1.5;
  display:flex; gap:11px; align-items:flex-start; flex-wrap:wrap;
}
.leverlist .tag{
  flex:none; padding:2px 8px; border-radius:3px;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10px;
  letter-spacing:.08em; text-transform:uppercase;
}
.leverlist .tag.quick{background:var(--signal-soft); color:var(--signal); border:1px solid var(--signal-line);}
.leverlist .tag.project{background:var(--accent-soft); color:var(--accent); border:1px solid var(--line-strong);}
.teamlist li{
  font-family:"Source Serif 4",Georgia,serif; font-size:16.5px; color:var(--ink-2);
  border-left:2px solid var(--line-strong); padding:2px 0 2px 16px; max-width:62ch;
}

[hidden]{display:none !important;}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
    </div>
    <div class="langtoggle" role="group" aria-label="Sprache / Language">
      <button type="button" data-lang="de" aria-pressed="true">DE</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <p class="lede" id="lede"></p>
  <p class="meta" id="metaline"></p>

  <ol class="rail" id="rail"></ol>
  <p class="railmeta" id="railmeta"></p>

  <!-- QUESTION STEPS -->
  <section id="quiz" class="card" aria-live="polite">
    <h2 class="dimhead" id="dimhead"></h2>
    <p class="dimintro" id="dimintro"></p>
    <div id="questions"></div>
    <div id="contextbox" class="freeblock" hidden>
      <p class="freeq" id="contextq"></p>
      <textarea id="q-context" rows="2"></textarea>
      <p class="freehint" id="contexthint"></p>
    </div>
    <p class="err" id="quizerr"></p>
    <div class="nav">
      <button type="button" class="btn btn-ghost" id="back"></button>
      <button type="button" class="btn" id="next"></button>
    </div>
  </section>

  <!-- LEAD STEP -->
  <section id="lead" class="card" hidden>
    <h2 class="dimhead" id="leadhead"></h2>
    <p class="dimintro" id="leadintro"></p>
    <form id="leadform" novalidate>
      <div class="fields">
        <div class="field"><label for="f-first" id="l-first"></label><input id="f-first" name="firstname" autocomplete="given-name"></div>
        <div class="field"><label for="f-last" id="l-last"></label><input id="f-last" name="lastname" autocomplete="family-name"></div>
        <div class="field full"><label for="f-email" id="l-email"></label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="f-company" id="l-company"></label><input id="f-company" name="company" autocomplete="organization"></div>
        <div class="field"><label for="f-size" id="l-size"></label><select id="f-size" name="company_size"></select></div>
        <div class="field full"><label for="f-role" id="l-role"></label><input id="f-role" name="jobtitle" autocomplete="organization-title"></div>
      </div>
      <label class="consent"><input type="checkbox" id="f-consent" required><span id="l-consent"></span></label>
      <label class="consent"><input type="checkbox" id="f-report"><span id="l-report"></span></label>
      <p class="err" id="leaderr"></p>
      <div class="nav">
        <button type="button" class="btn btn-ghost" id="leadback"></button>
        <button type="button" class="btn" id="leadsubmit"></button>
      </div>
    </form>
  </section>

  <!-- RESULT -->
  <section id="result" hidden>
    <div class="verdict">
      <p class="stagechip"><span id="stagelabel"></span><span class="stagedots" id="stagedots" aria-hidden="true"></span></p>
      <h2 id="stagename"></h2>
      <p id="stagedesc"></p>
      <p id="stagestruct"></p>
    </div>

    <p class="section-label" id="profilelabel"></p>
    <div class="profile" id="profile"></div>

    <p class="section-label" id="noteslabel"></p>
    <div class="notes" id="notes"></div>

    <div class="gap">
      <p class="section-label" id="gaplabel"></p>
      <h3 id="gapname"></h3>
      <p id="gaptext"></p>
    </div>

    <div class="cta">
      <h3 id="ctahead"></h3>
      <p id="ctatext"></p>
      <div class="ctarow">
        <a class="btn" id="ctabtn" href="#" target="_blank" rel="noopener"></a>
        <span class="hint" id="ctahint"></span>
      </div>
    </div>

    <section class="deepoffer" id="deepoffer"></section>

    <p class="foot" id="foot"></p>
  </section>

  <!-- VERTIEFUNG: Fragen -->
  <section id="deepquiz" class="card" hidden>
    <h2 class="dimhead" id="deepquizhead"></h2>
    <p class="dimintro" id="deepquizintro"></p>
    <div id="deepquestions"></div>
    <div class="freeblock">
      <p class="section-label" id="deepfreelabel"></p>
      <p class="freeq" id="deepfreeq"></p>
      <textarea id="deepfree" rows="4"></textarea>
      <p class="freehint" id="deepfreehint"></p>
    </div>
    <p class="err" id="deeperr"></p>
    <div class="nav">
      <button type="button" class="btn btn-ghost" id="deepcancel"></button>
      <button type="button" class="btn" id="deepsubmit"></button>
    </div>
  </section>

  <!-- VERTIEFUNG: Ergebnis -->
  <section id="deepresult" hidden>
    <div class="deepverdict">
      <h2 id="deepresulthead"></h2>
      <span class="big" id="deepresultscore"></span>
    </div>

    <p class="section-label" id="deepsublabel"></p>
    <div class="subs" id="deepsubs"></div>

    <p class="section-label" id="deepleverlabel"></p>
    <ul class="leverlist" id="deeplevers"></ul>

    <p class="section-label" id="deepteamlabel"></p>
    <ul class="teamlist" id="deepteam"></ul>

    <div class="cta">
      <h3 id="deepctahead"></h3>
      <p id="deepctatext"></p>
      <div class="ctarow">
        <a class="btn" id="deepctabtn" href="#" target="_blank" rel="noopener"></a>
        <span class="hint" id="deepctahint"></span>
      </div>
    </div>

    <div class="nav">
      <button type="button" class="btn btn-ghost" id="deepback"></button>
      <span></span>
    </div>
  </section>
</div>

<script>
/* ------------------------------------------------------------------
   KONFIGURATION  (hier anpassen, bevor du das Tool live schaltest)
   ------------------------------------------------------------------ */

let lang = "de";
let step = 0;                 // 0..4 = Dimensionen, 5 = Lead
const answers = {};           // "D1-0" -> 1..4
const contextText = {};       // dimId -> optionaler Kurzcheck-Freitext

const $ = (id) => document.getElementById(id);

// Wiederholungs-Schutz (Soft-Guard, pro Browser). localStorage kann im Wix-iFrame
// gesperrt sein, deshalb alles in try/catch: schlaegt es fehl, greift der Guard einfach nicht.
const LS_KEY = "hr_reifegrad_v2";
function lsGet(){ try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function lsSet(obj){ try { localStorage.setItem(LS_KEY, JSON.stringify(obj)); } catch(e){} }
function restoreState(){
  const saved = lsGet();
  if (!saved || !saved.answers) return false;
  const a = saved.answers;
  const complete = DIMS.every(d => d.q.every((_,i)=> a[d.key+"-"+i]));
  if (!complete) return false;
  Object.assign(answers, a);
  if (saved.contextText) Object.assign(contextText, saved.contextText);
  if (saved.lang === "en" || saved.lang === "de"){
    lang = saved.lang;
    document.documentElement.lang = lang;
    document.querySelectorAll(".langtoggle button").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.lang===lang)));
  }
  return true;
}

function stageOf(score){
  if (score < 1.75) return 0;
  if (score < 2.50) return 1;
  if (score < 3.25) return 2;
  return 3;
}

function evaluate(){
  const dims = DIMS.map(d => {
    const vals = d.q.map((_,i) => answers[d.key+"-"+i]);
    const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
    return { id:d.id, key:d.key, mean, stage:stageOf(mean) };
  });
  const all = Object.values(answers);
  const overallMean = all.reduce((a,b)=>a+b,0)/all.length;
  const lowest = Math.min(...dims.map(d=>d.mean));
  // Schwaechstes-Glied-Regel: der Gesamtreifegrad kann die schwaechste
  // Dimension um hoechstens zwei Stufen ueberholen. Wer in vier Dimensionen
  // stark ist und in einer bei null steht, ist nicht "strategisch".
  const overallStage = Math.min(stageOf(overallMean), stageOf(lowest) + 2);
  const weakest = dims
    .slice()
    .sort((a,b) => a.mean - b.mean || GAP_PRIORITY.indexOf(a.id) - GAP_PRIORITY.indexOf(b.id))[0];
  return { dims, overallMean, overallStage, weakest };
}

function renderRail(){
  const total = DIMS.length + 1;
  $("rail").innerHTML = Array.from({length:total},(_,i)=>{
    const state = i < step ? "done" : (i === step ? "current" : "todo");
    return `<li data-state="${state}"></li>`;
  }).join("");
  $("railmeta").textContent = step < DIMS.length
    ? t().railmeta(step+1, total, DIMS[step][lang].name)
    : t().railmetaLead(total);
}

function renderStep(){
  renderRail();
  const onQuiz = step < DIMS.length;
  $("quiz").hidden = !onQuiz;
  $("lead").hidden = onQuiz;
  $("result").hidden = true;
  if (!onQuiz) return;

  const d = DIMS[step];
  $("dimhead").textContent = d[lang].name;
  $("dimintro").textContent = d[lang].intro;
  $("quizerr").textContent = "";
  $("back").style.visibility = step === 0 ? "hidden" : "visible";
  $("next").textContent = step === DIMS.length-1 ? t().toLead : t().next;

  $("questions").innerHTML = d.q.map((q,i)=>{
    const name = d.key+"-"+i;
    const opts = SCALE[lang].map((label,j)=>{
      const val = j+1;
      const checked = answers[name] === val ? " checked" : "";
      return `<label class="opt"><input type="radio" name="${name}" value="${val}"${checked}><span>${label}</span></label>`;
    }).join("");
    return `<fieldset><legend><span class="qno">${step+1}.${i+1}</span>${q[lang]}</legend><div class="opts">${opts}</div></fieldset>`;
  }).join("");

  $("questions").querySelectorAll("input[type=radio]").forEach(r=>{
    r.addEventListener("change", e=>{
      answers[e.target.name] = Number(e.target.value);
      $("quizerr").textContent = "";
    });
  });

  // Optionaler Freitext je Dimension
  $("contextbox").hidden = false;
  $("contextq").textContent = CONTEXT[d.id][lang];
  $("contexthint").textContent = t().contextHint;
  const ta = $("q-context");
  ta.value = contextText[d.id] || "";
  ta.oninput = () => { contextText[d.id] = ta.value; };

  window.scrollTo({top:0, behavior:"smooth"});
}

function stepComplete(){
  const d = DIMS[step];
  return d.q.every((_,i)=> answers[d.key+"-"+i]);
}

$("next").addEventListener("click", ()=>{
  if (!stepComplete()){ $("quizerr").textContent = t().quizerr; return; }
  step++; renderStep();
});
$("back").addEventListener("click", ()=>{ if(step>0){ step--; renderStep(); } });
$("leadback").addEventListener("click", ()=>{ step = DIMS.length-1; renderStep(); });

document.querySelectorAll(".langtoggle button").forEach(b=>{
  b.addEventListener("click", ()=>{
    lang = b.dataset.lang;
    document.querySelectorAll(".langtoggle button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
    document.documentElement.lang = lang;
    renderChrome();
    if (!$("deepresult").hidden) renderDeepResult();
    else if (!$("deepquiz").hidden) renderDeepQuiz();
    else if (!$("result").hidden) renderResult(evaluate());
    else renderStep();
  });
});

function renderResult(r){
  $("quiz").hidden = true; $("lead").hidden = true; $("result").hidden = false;
  $("rail").innerHTML = Array.from({length:DIMS.length+1},()=>'<li data-state="done"></li>').join("");
  $("railmeta").textContent = t().railmetaDone;
  const st = STAGES[lang][r.overallStage];

  $("stagelabel").textContent = t().stagelabel + " " + (r.overallStage+1) + "/4";
  $("stagedots").innerHTML = [0,1,2,3].map(i=>`<i class="${i<=r.overallStage?"on":""}"></i>`).join("");
  $("stagename").textContent = st.name;
  $("stagedesc").textContent = st.desc;
  $("stagestruct").textContent = st.struct;

  $("profilelabel").textContent = t().profilelabel;
  $("noteslabel").textContent = t().noteslabel;
  $("gaplabel").textContent = t().gaplabel;

  // Ein "engster Punkt" wird nur markiert, wenn die schwaechste Dimension
  // wirklich Luft nach oben hat. Bei durchgehend hohen Werten waere das unehrlich.
  const showGap = r.weakest.mean < 3.5;
  document.querySelector(".gap").hidden = !showGap;

  const ZONE = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)"];
  $("profile").innerHTML = r.dims.map(d=>{
    const dim = DIMS.find(x=>x.id===d.id);
    const isWeak = showGap && d.id === r.weakest.id;
    // Ampel-Zonen: alle vier Zonen sichtbar, die erreichte Stufe hervorgehoben.
    const meter = [0,1,2,3].map(i=>{
      const here = i===d.stage;
      return `<i style="background:${ZONE[i]};opacity:${here?"1":".22"}${here?";outline:1.5px solid var(--ink);outline-offset:0":""}"></i>`;
    }).join("");
    return `<div class="prow${isWeak?" weak":""}">
      <div class="pname">${dim[lang].name}${isWeak?`<span class="tag">${t().weak}</span>`:""}</div>
      <div class="meter" role="img" aria-label="${dim[lang].name}: ${t().scoreOf(d.mean)}">${meter}</div>
      <div class="pscore">${t().scoreOf(d.mean)}</div>
    </div>`;
  }).join("");

  $("notes").innerHTML = r.dims.map(d=>{
    const dim = DIMS.find(x=>x.id===d.id);
    const isWeak = showGap && d.id === r.weakest.id;
    return `<div class="note${isWeak?" weak":""}">
      <h3>${dim[lang].name}</h3>
      <p>${NOTES[d.id][lang][d.stage]}</p>
    </div>`;
  }).join("");

  const weakDim = DIMS.find(x=>x.id===r.weakest.id);
  $("gapname").textContent = weakDim[lang].name;
  $("gaptext").textContent = GAPTEXT[r.weakest.id][lang];

  $("ctahead").textContent = t().ctahead;
  $("ctatext").textContent = t().ctatext;
  $("ctabtn").textContent = t().ctabtn;
  $("ctabtn").href = CONFIG.bookingUrl;
  $("ctahint").textContent = t().ctahint;
  $("foot").textContent = t().foot;
  lastResult = r;
  renderDeepOffer();
  window.scrollTo({top:0, behavior:"smooth"});
}

function buildPayload(r, event){
  const fields = {
    email: $("f-email").value.trim(),
    firstname: $("f-first").value.trim(),
    lastname: $("f-last").value.trim(),
    company: $("f-company").value.trim(),
    jobtitle: $("f-role").value.trim(),
    company_size: $("f-size").value,
    hr_maturity_stage: String(r.overallStage + 1),
    hr_maturity_stage_name: STAGES[lang][r.overallStage].name,
    hr_maturity_overall: r.overallMean.toFixed(2),
    hr_maturity_weakest: r.weakest ? r.weakest.id : "",
    hr_maturity_language: lang,
    hr_maturity_wants_report: $("f-report").checked ? "true" : "false",
    // Steuerung fuer das Make-Routing: "lead" beim Kurzcheck, "deep" bei Vertiefung
    hr_event: event || "lead",
    // DSGVO-Nachweis fuer die HubSpot-Notiz
    consent: "true",
    consent_text: UI[lang].consent,
    consent_timestamp: new Date().toISOString(),
    page_url: location.href
  };
  // Aufgeloeste Texte, damit Make Report/Notiz ohne eigene Logik bauen kann
  fields["stage_desc"] = STAGES[lang][r.overallStage].desc;
  if (r.weakest){
    const wd = DIMS.find(d => d.id === r.weakest.id);
    fields["weakest_name"] = wd ? wd[lang].name : r.weakest.id;
    fields["weakest_gaptext"] = GAPTEXT[r.weakest.id][lang];
  }
  r.dims.forEach(d => {
    fields["hr_maturity_" + d.id] = d.mean.toFixed(2);
    fields["note_" + d.id] = NOTES[d.id][lang][d.stage];
    // Kurzcheck-Freitext je Dimension (nur fuer Marcos Notiz/Report, nie im Lead-Report)
    fields["hr_context_" + d.id] = (contextText[d.id] || "");
  });
  DIMS.forEach(d => d.q.forEach((_,i) => { fields["hr_q_" + d.key + "_" + (i+1)] = String(answers[d.key+"-"+i]); }));
  // Vertiefungen, sofern der Nutzer welche gemacht hat
  fields["hr_deep_areas"] = deepDone.join(",");
  deepDone.forEach(id => {
    const dd = evaluateDeep(id);
    fields["hr_deep_" + id] = dd.mean.toFixed(2);
    dd.groups.forEach((g,i) => { fields["hr_deep_" + id + "_g" + (i+1)] = g.mean.toFixed(2); });
    if (deepFree[id]) fields["hr_deep_" + id + "_text"] = deepFree[id];
  });
  return fields;
}

async function send(fields){
  if (CONFIG.mode === "hubspot"){
    const host = CONFIG.hubspot.submitHost || "api.hsforms.com";
    const url = `https://${host}/submissions/v3/integration/submit/${CONFIG.hubspot.portalId}/${CONFIG.hubspot.formGuid}`;
    const body = {
      fields: Object.entries(fields).map(([name,value])=>({objectTypeId:"0-1", name, value})),
      context: { pageUri: location.href, pageName: document.title },
      legalConsentOptions: { consent: {
        consentToProcess: true,
        text: UI[lang].consent,
        communications: [{ value:true, subscriptionTypeId:0, text: UI[lang].consent }]
      }}
    };
    const res = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    if (!res.ok) throw new Error("HubSpot " + res.status);
    return;
  }
  if (CONFIG.mode === "webhook"){
    // Als application/x-www-form-urlencoded senden: CORS-safelisted (kein Preflight-OPTIONS)
    // und von Make automatisch in benannte Felder geparst. URLSearchParams setzt den
    // Content-Type selbst; keine custom Header.
    const res = await fetch(CONFIG.webhookUrl, {method:"POST", body:new URLSearchParams(fields)});
    if (!res.ok) throw new Error("Webhook " + res.status);
    return;
  }
  console.log("[HR-Reifegrad-Check] Demo-Modus, es wurde nichts gesendet:", fields);
}

$("f-email").addEventListener("input", ()=>{ $("f-email").classList.remove("invalid"); });
$("f-consent").addEventListener("change", ()=>{ $("f-consent").closest(".consent").classList.remove("invalid"); });

async function submitLead(e){
  if (e) e.preventDefault();
  const email = $("f-email").value.trim();
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
  const consentOk = $("f-consent").checked;
  $("f-email").classList.toggle("invalid", !emailOk);
  $("f-consent").closest(".consent").classList.toggle("invalid", !consentOk);
  if (!emailOk || !consentOk){
    $("leaderr").textContent = !emailOk && !consentOk ? t().errBoth : (!emailOk ? t().errEmail : t().errConsent);
    (!emailOk ? $("f-email") : $("f-consent")).focus();
    $("leaderr").scrollIntoView({block:"center", behavior:"smooth"});
    return;
  }
  $("leaderr").textContent = "";
  const btn = $("leadsubmit");
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = t().sending;
  const r = evaluate();
  try { await send(buildPayload(r, "lead")); }
  catch(err){ console.error(err); }   // Ergebnis wird trotzdem gezeigt
  lsSet({ v:2, ts:Date.now(), lang, answers, contextText });   // Wiederholungs-Schutz
  btn.disabled = false; btn.textContent = label;
  renderResult(r);
}

// Zwei Wege in dieselbe Funktion: Klick auf den Button und Enter im Formular.
// Der Klick ist der verlaessliche, weil sandboxed iframes das submit-Event
// eines Formulars blockieren koennen.
$("leadsubmit").addEventListener("click", submitLead);
$("leadform").addEventListener("submit", submitLead);


/* ------------------------------------------------------------------
   VERTIEFUNG: Ablauf
   ------------------------------------------------------------------ */
let lastResult = null;      // Ergebnis des Kurzchecks
let deepCurrent = null;     // id der gerade vertieften Dimension
const deepAnswers = {};     // "strategie-0" -> 1..4
const deepFree = {};        // "strategie" -> Freitext
const deepDone = [];        // ids der abgeschlossenen Vertiefungen

function dt(){ return DEEPUI[lang]; }

function renderDeepOffer(){
  const offer = $("deepoffer");
  // Vertiefung ist bewusst auf einmal begrenzt: nach der ersten Vertiefung keine
  // weitere Offerte mehr.
  if (deepDone.length >= 1){
    offer.innerHTML = `<p class="section-label">${dt().offerLabel}</p><p class="deepdone">${dt().oneDone}</p>`;
    return;
  }
  const remaining = DIMS.filter(d => !deepDone.includes(d.id));
  if (!remaining.length){
    offer.innerHTML = `<p class="section-label">${dt().offerLabel}</p><p class="deepdone">${dt().allDone}</p>`;
    return;
  }
  const suggest = lastResult && !deepDone.includes(lastResult.weakest.id) && lastResult.weakest.mean < 3.5
    ? lastResult.weakest.id : remaining[0].id;
  const head = deepDone.length
    ? dt().againHead
    : (suggest === (lastResult && lastResult.weakest.id) && lastResult.weakest.mean < 3.5
        ? dt().offerHeadWeak(DIMS.find(d=>d.id===suggest)[lang].name)
        : dt().offerHead);

  offer.innerHTML = `
    <p class="section-label">${dt().offerLabel}</p>
    <h3>${head}</h3>
    <p class="deeptext">${dt().offerText}</p>
    <div class="deeppick">
      <select id="deepselect" aria-label="${dt().offerPick}">
        ${remaining.map(d=>`<option value="${d.id}"${d.id===suggest?" selected":""}>${d[lang].name}${d.id===suggest&&!deepDone.length?" ("+dt().recommended+")":""}</option>`).join("")}
      </select>
      <button type="button" class="btn" id="deepstart">${dt().offerStart}</button>
    </div>`;
  $("deepstart").addEventListener("click", ()=>{
    deepCurrent = $("deepselect").value;
    renderDeepQuiz();
  });
}

function renderDeepQuiz(){
  $("result").hidden = true; $("deepresult").hidden = true; $("deepquiz").hidden = false;
  const dim = DIMS.find(d=>d.id===deepCurrent);
  const deep = DEEP[deepCurrent];
  $("deepquizhead").textContent = dt().deepHead(dim[lang].name);
  $("deepquizintro").textContent = dim[lang].intro;
  $("deeperr").textContent = "";

  let n = 0;
  $("deepquestions").innerHTML = deep.groups.map((g,gi)=>{
    const items = g.q.map((q,qi)=>{
      n++;
      const name = `${deepCurrent}-${gi*2+qi}`;
      const opts = SCALE[lang].map((label,j)=>{
        const val = j+1;
        const checked = deepAnswers[name] === val ? " checked" : "";
        return `<label class="opt"><input type="radio" name="${name}" value="${val}"${checked}><span>${label}</span></label>`;
      }).join("");
      return `<fieldset><legend><span class="qno">${n}</span>${q[lang]}</legend><div class="opts">${opts}</div></fieldset>`;
    }).join("");
    return `<p class="groupname">${g.name[lang]}</p>${items}`;
  }).join("");

  $("deepquestions").querySelectorAll("input[type=radio]").forEach(r=>{
    r.addEventListener("change", e=>{ deepAnswers[e.target.name] = Number(e.target.value); $("deeperr").textContent=""; });
  });

  $("deepfreelabel").textContent = dt().freeLabel;
  $("deepfreeq").textContent = deep.free[lang];
  $("deepfreehint").textContent = dt().freeHint;
  $("deepfree").value = deepFree[deepCurrent] || "";
  $("deepcancel").textContent = dt().deepBack;
  $("deepsubmit").textContent = dt().deepSubmit;
  window.scrollTo({top:0, behavior:"smooth"});
}

function evaluateDeep(id){
  const deep = DEEP[id];
  const groups = deep.groups.map((g,gi)=>{
    const a = deepAnswers[`${id}-${gi*2}`], b = deepAnswers[`${id}-${gi*2+1}`];
    const mean = (a+b)/2;
    // Schwelle bewusst bei 3,0: ein Teilaspekt "traegt" erst, wenn beide
    // Aussagen mindestens weitgehend zutreffen. Bei 2,5 waere das geschmeichelt.
    return { name:g.name, mean, carries: mean >= 3, text: mean >= 3 ? g.high : g.low };
  });
  const mean = groups.reduce((s,g)=>s+g.mean,0)/groups.length;
  return { id, groups, mean, band: mean < 3 ? "build" : "scale" };
}

function renderDeepResult(){
  const d = evaluateDeep(deepCurrent);
  const dim = DIMS.find(x=>x.id===deepCurrent);
  const deep = DEEP[deepCurrent];
  $("result").hidden = true; $("deepquiz").hidden = true; $("deepresult").hidden = false;

  const ZONE = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)"];

  $("deepresulthead").textContent = dt().deepHead(dim[lang].name);
  $("deepresultscore").textContent = dt().deepScore(d.mean);
  $("deepsublabel").textContent = dt().subLabel;
  $("deepsubs").innerHTML = d.groups.map(g=>`
    <div class="subrow${g.carries?"":" weakish"}">
      <div class="subhead">
        <span class="subname">${g.name[lang]}</span>
        <span class="subscore">${dt().deepScore(g.mean)}</span>
      </div>
      <div class="meter">${[0,1,2,3].map(i=>{const here=i===stageOf(g.mean);return `<i style="background:${ZONE[i]};opacity:${here?"1":".22"}${here?";outline:1.5px solid var(--ink);outline-offset:0":""}"></i>`;}).join("")}</div>
      <p>${g.text[lang]}</p>
    </div>`).join("");

  $("deepleverlabel").textContent = dt().leverLabel;
  $("deeplevers").innerHTML = deep.levers[d.band].map(l=>`
    <li><span class="tag ${l.tag}">${l.tag==="quick"?dt().tagQuick:dt().tagProject}</span>${l[lang]}</li>`).join("");

  $("deepteamlabel").textContent = dt().teamLabel;
  $("deepteam").innerHTML = deep.teamq[lang].map(q=>`<li>${q}</li>`).join("");

  $("deepctahead").textContent = t().ctahead;
  $("deepctatext").textContent = t().ctatext;
  $("deepctabtn").textContent = t().ctabtn;
  $("deepctabtn").href = CONFIG.bookingUrl;
  $("deepctahint").textContent = t().ctahint;
  $("deepback").textContent = dt().deepBack;
  window.scrollTo({top:0, behavior:"smooth"});
}

$("deepsubmit").addEventListener("click", async ()=>{
  const deep = DEEP[deepCurrent];
  const complete = deep.groups.every((g,gi)=> deepAnswers[`${deepCurrent}-${gi*2}`] && deepAnswers[`${deepCurrent}-${gi*2+1}`]);
  if (!complete){ $("deeperr").textContent = dt().deepErr; return; }
  deepFree[deepCurrent] = $("deepfree").value.trim();
  if (!deepDone.includes(deepCurrent)) deepDone.push(deepCurrent);
  // Nachmeldung an HubSpot bzw. Make: gleiche E-Mail, ergaenzte Felder.
  try { await send(buildPayload(lastResult, "deep")); } catch(err){ console.error(err); }
  renderDeepResult();
});

$("deepcancel").addEventListener("click", ()=>{
  $("deepquiz").hidden = true; $("result").hidden = false;
  renderDeepOffer();
  window.scrollTo({top:0, behavior:"smooth"});
});

$("deepback").addEventListener("click", ()=>{
  $("deepresult").hidden = true; $("result").hidden = false;
  renderDeepOffer();
  window.scrollTo({top:0, behavior:"smooth"});
});

// Wiederholungs-Schutz: hat dieser Browser den Check schon gemacht, direkt das
// gespeicherte Ergebnis zeigen statt eines neuen Durchlaufs.
const restored = restoreState();
renderChrome();
if (restored) renderResult(evaluate());
else renderStep();
</script>
